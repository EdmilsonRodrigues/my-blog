[project]
name = "my-blog"
version = "0.1.0"
description = "My personal blog"
authors = [
    {name = "Edmilson Rodrigues",email = "edmilson.rodriguesn38@gmail.com"}
]
license = "AGPL3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all] (>=0.162.0,<0.163.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "passlib (>=1.7.4,<2.0.0)"
]

[dependency-groups]
dev = [
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "zuban (>=0.10.1,<0.11.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
