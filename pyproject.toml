[project]
name = "my-blog"
version = "0.1.0"
description = "My personal blog"
authors = [
    {name = "Edmilson Rodrigues",email = "edmilson.rodriguesn38@gmail.com"}
]
license = "AGPL3"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all] (>=0.162.0,<0.163.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "passlib (>=1.7.4,<2.0.0)"
]

[dependency-groups]
dev = [
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "zuban (>=0.10.1,<0.11.0)",
    "black (>=26.10.1,<27.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 79
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
